name: Auto-merge validated Dependabot security updates

on:
  workflow_run:
    workflows:
      - "Security checks"
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-security-automerge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  merge-security-update:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate eligible Dependabot security PR
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_URL: ${{ github.event.workflow_run.pull_requests[0].url }}
        shell: bash
        run: |
          set -euo pipefail

          echo "eligible=false" >> "$GITHUB_OUTPUT"

          if [ -z "${PR_URL:-}" ]; then
            echo "No pull request attached to this workflow run."
            exit 0
          fi

          pr_number="${PR_URL##*/}"
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Unable to resolve a pull request number."
            exit 0
          fi

          pr_json="$(gh api "/repos/$REPO/pulls/$pr_number")"
          state="$(jq -r '.state' <<< "$pr_json")"
          draft="$(jq -r '.draft' <<< "$pr_json")"
          author="$(jq -r '.user.login' <<< "$pr_json")"
          head_ref="$(jq -r '.head.ref' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_json")"

          if [ "$state" != "open" ] || [ "$draft" != "false" ]; then
            echo "PR #$pr_number is not an open ready-for-review PR."
            exit 0
          fi

          if [ "$base_ref" != "main" ]; then
            echo "PR #$pr_number does not target main."
            exit 0
          fi

          if [ "$author" != "dependabot[bot]" ]; then
            echo "PR #$pr_number is not authored by Dependabot."
            exit 0
          fi

          case "$head_ref" in
            dependabot/*/security-updates-*|dependabot/*/*security*update*) ;;
            *)
              echo "PR #$pr_number is a Dependabot PR, but not a grouped security update."
              exit 0
              ;;
          esac

          if [ "$head_sha" != "$RUN_HEAD_SHA" ]; then
            echo "PR head moved after the successful Security checks run; refusing automatic merge."
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Merge validated security update and delete branch
        if: steps.validate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.validate.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA"

      - name: Remove temporary artifacts from validated security run
        if: steps.validate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name] | @tsv' 2>/dev/null \
            | while IFS=$'\t' read -r id name; do
                [ -n "${id:-}" ] || continue
                case "$name" in
                  diagnostic-*|security-temp-*|dependency-graph_*)
                    echo "Deleting temporary artifact: $name ($id)"
                    gh api --silent --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
                    ;;
                  *)
                    echo "Keeping non-temporary artifact: $name"
                    ;;
                esac
              done

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Dependabot security automation"
            if [ "${{ steps.validate.outputs.eligible }}" = "true" ]; then
              echo "- Security checks were fully green."
              echo "- Eligible Dependabot security PR was merged with head-SHA protection."
              echo "- Temporary branch deletion was requested at merge time."
              echo "- Only explicitly temporary security artifacts were eligible for immediate deletion."
              echo "- Workflow history, releases and functional code history are preserved."
            else
              echo "- No eligible Dependabot security PR was merged by this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
