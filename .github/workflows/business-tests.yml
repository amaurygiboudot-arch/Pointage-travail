name: HoraTrack business tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: horatrack-business-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-cleanup: on-success

      - name: Tester les regles metier Android
        run: gradle :app:testDebugUnitTest --build-cache --stacktrace
