name: Compiler HoraTrack APK et AAB

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Security checks" ]
    types: [ completed ]

concurrency:
  group: horatrack-apk-aab
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Recuperer le projet valide
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Fixer le commit source
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "SOURCE_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          else
            echo "SOURCE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-cleanup: on-success

      - name: Controle manuel avant publication
        if: github.event_name == 'workflow_dispatch'
        run: |
          gradle :app:testDebugUnitTest :app:assemblePlay --stacktrace
          manifest="$(find app/build/intermediates -type f -name AndroidManifest.xml -path '*/play/*' | head -n 1)"
          test -n "$manifest"
          ! grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' "$manifest"
          ! grep -Fq '.update-files' "$manifest"
          ! grep -Fq 'UpdateDownloadReceiver' "$manifest"
          ! grep -Fq 'HpFirebaseMessagingService' "$manifest"

      - name: Restaurer la cle de signature HoraTrack
        env:
          KEYSTORE_B64: ${{ secrets.POINTAGE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POINTAGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POINTAGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POINTAGE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Secret POINTAGE_KEYSTORE_B64 manquant" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Secret POINTAGE_KEYSTORE_PASSWORD manquant" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Secret POINTAGE_KEY_ALIAS manquant" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Secret POINTAGE_KEY_PASSWORD manquant" && exit 1)
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pointage-release.keystore"

      - name: Preparer la version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Compiler APK et AAB release signes
        id: gradle_build
        env:
          POINTAGE_KEYSTORE_PATH: ${{ runner.temp }}/pointage-release.keystore
          POINTAGE_KEYSTORE_PASSWORD: ${{ secrets.POINTAGE_KEYSTORE_PASSWORD }}
          POINTAGE_KEY_ALIAS: ${{ secrets.POINTAGE_KEY_ALIAS }}
          POINTAGE_KEY_PASSWORD: ${{ secrets.POINTAGE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: |
          set +e
          gradle :app:assembleRelease :app:bundleRelease --build-cache --parallel --stacktrace 2>&1 | tee build-error.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publier le diagnostic si la compilation echoue
        if: steps.gradle_build.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-compilation-${{ github.run_number }}
          path: build-error.log
          if-no-files-found: error
          retention-days: 14

      - name: Arreter le build si la compilation echoue
        if: steps.gradle_build.outputs.exit_code != '0'
        run: |
          echo "La compilation Gradle a echoue. Le log complet est disponible dans l'artefact diagnostic-compilation-${{ github.run_number }}."
          exit 1

      - name: Verifier la signature APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER" || (echo "apksigner introuvable" && exit 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Preparer APK AAB et informations de version
        run: |
          cp app/build/outputs/apk/release/app-release.apk HoraTrack.apk
          cp HoraTrack.apk HP-Travail.apk
          cp app/build/outputs/bundle/release/app-release.aab HoraTrack.aab
          sha256sum HoraTrack.apk > HoraTrack-SHA256.txt
          sha256sum HoraTrack.aab > HoraTrack-AAB-SHA256.txt
          cp HoraTrack-SHA256.txt SHA256.txt
          printf '%s\n' "$VERSION_NAME" > HoraTrack-version.txt
          # Alias techniques conserves temporairement pour les anciennes versions deja installees.
          cp HoraTrack-SHA256.txt HP-Travail-SHA256.txt
          cp HoraTrack-version.txt HP-Travail-version.txt
          test -s HoraTrack.apk
          test -s HP-Travail.apk
          test -s HoraTrack.aab
          test -s HoraTrack-SHA256.txt
          test -s HoraTrack-AAB-SHA256.txt
          test -s SHA256.txt

      - name: Publier artefacts APK et AAB
        uses: actions/upload-artifact@v4
        with:
          name: HoraTrack-APK-AAB
          path: |
            HoraTrack.apk
            HoraTrack.aab
            HoraTrack-SHA256.txt
            HoraTrack-AAB-SHA256.txt
            HoraTrack-version.txt
            SHA256.txt
            HP-Travail.apk
            HP-Travail-SHA256.txt
            HP-Travail-version.txt
          if-no-files-found: error
          retention-days: 30

      - name: Envoyer automatiquement l APK dans Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ] || [ -z "$FIREBASE_APP_ID" ]; then
            echo "Firebase App Distribution non configure : secret FIREBASE_SERVICE_ACCOUNT_JSON ou FIREBASE_APP_ID manquant."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npm install --global firebase-tools
          firebase appdistribution:distribute HoraTrack.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes "HoraTrack ${VERSION_NAME} - mise a jour automatique depuis GitHub Actions"
          rm -f "$RUNNER_TEMP/firebase-service-account.json"

      - name: Publier la mise a jour GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" \
            HoraTrack.apk \
            HoraTrack.aab \
            HoraTrack-SHA256.txt \
            HoraTrack-AAB-SHA256.txt \
            HoraTrack-version.txt \
            SHA256.txt \
            HP-Travail.apk \
            HP-Travail-SHA256.txt \
            HP-Travail-version.txt \
            --target "${SOURCE_SHA}" \
            --title "HoraTrack ${VERSION_NAME}" \
            --notes "Mise à jour automatique HoraTrack - APK + AAB Google Play" \
            --latest

      - name: Verifier que la mise a jour est publiquement disponible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets,url
          gh release download "$TAG" -p "HoraTrack.apk" -D "$RUNNER_TEMP/release-check"
          gh release download "$TAG" -p "HoraTrack.aab" -D "$RUNNER_TEMP/release-check"
          gh release download "$TAG" -p "SHA256.txt" -D "$RUNNER_TEMP/release-check"
          test -s "$RUNNER_TEMP/release-check/HoraTrack.apk"
          test -s "$RUNNER_TEMP/release-check/HoraTrack.aab"
          test -s "$RUNNER_TEMP/release-check/SHA256.txt"

      - name: Notifier tous les telephones HoraTrack
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "Firebase push non configure : APK publie normalement, notification distante ignoree."
            exit 0
          fi
          python -m pip install --quiet google-auth requests
          python <<'PY'
          import json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          info = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"])
          project = os.environ["FIREBASE_PROJECT_ID"]
          version = os.environ["VERSION_NAME"]
          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/firebase.messaging"],
          )
          credentials.refresh(Request())
          payload = {
              "message": {
                  "topic": "hp_travail_updates",
                  "notification": {
                      "title": "Mise à jour HoraTrack",
                      "body": f"La version {version} est disponible. Ouvre HoraTrack pour l'installer."
                  },
                  "data": {
                      "kind": "update",
                      "version": version,
                      "title": "Mise à jour HoraTrack",
                      "body": f"La version {version} est disponible. Ouvre HoraTrack pour l'installer."
                  },
                  "android": {
                      "priority": "high",
                      "notification": {
                          "channel_id": "hp_travail_updates"
                      }
                  }
              }
          }
          response = requests.post(
              f"https://fcm.googleapis.com/v1/projects/{project}/messages:send",
              headers={"Authorization": f"Bearer {credentials.token}", "Content-Type": "application/json"},
              json=payload,
              timeout=30,
          )
          response.raise_for_status()
          print("Notification de mise a jour HoraTrack envoyee")
          PY
