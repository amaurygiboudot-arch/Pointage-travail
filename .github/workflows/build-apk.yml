name: Compiler HP Travail APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: hp-travail-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compiler HP Travail
        run: gradle :app:assembleDebug --stacktrace

      - name: Renommer APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HP-Travail.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: HP-Travail-APK
          path: HP-Travail.apk
          if-no-files-found: error
          retention-days: 30
