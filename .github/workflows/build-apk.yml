name: Compiler HoraTrack APK et AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/icon-build-trigger.txt"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: horatrack-apk-aab
  cancel-in-progress: false

jobs:
  security-gate:
    name: Controle avant compilation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-cleanup: on-success

      - name: Verifier les icones launcher
        run: python scripts/verify_launcher_icons.py

      - name: Verifier le chemin unique de mise a jour
        run: python scripts/verify_update_architecture.py

      - name: Tests unitaires et controle Google Play
        run: |
          gradle :app:testDebugUnitTest :app:assemblePlay --stacktrace
          manifest="$(find app/build/intermediates -type f -name AndroidManifest.xml -path '*/play/*' | head -n 1)"
          test -n "$manifest"
          ! grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' "$manifest"
          ! grep -Fq '.update-files' "$manifest"
          ! grep -Fq 'UpdateDownloadReceiver' "$manifest"
          ! grep -Fq 'HpFirebaseMessagingService' "$manifest"

  build:
    name: Compiler et publier HoraTrack
    needs: security-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Recuperer exactement le commit controle
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Fixer le commit source
        run: echo "SOURCE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-cleanup: on-success

      - name: Restaurer la cle de signature HoraTrack
        env:
          KEYSTORE_B64: ${{ secrets.POINTAGE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POINTAGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POINTAGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POINTAGE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Secret POINTAGE_KEYSTORE_B64 manquant" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Secret POINTAGE_KEYSTORE_PASSWORD manquant" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Secret POINTAGE_KEY_ALIAS manquant" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Secret POINTAGE_KEY_PASSWORD manquant" && exit 1)
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pointage-release.keystore"

      - name: Preparer la version
        run: |
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Compiler APK release et AAB Play signes
        id: gradle_build
        env:
          POINTAGE_KEYSTORE_PATH: ${{ runner.temp }}/pointage-release.keystore
          POINTAGE_KEYSTORE_PASSWORD: ${{ secrets.POINTAGE_KEYSTORE_PASSWORD }}
          POINTAGE_KEY_ALIAS: ${{ secrets.POINTAGE_KEY_ALIAS }}
          POINTAGE_KEY_PASSWORD: ${{ secrets.POINTAGE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: |
          set +e
          gradle :app:assembleRelease :app:bundlePlay --build-cache --parallel --stacktrace 2>&1 | tee build-error.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publier le diagnostic si la compilation echoue
        if: steps.gradle_build.outputs.exit_code != '0'
        uses: actions/upload-artifact@v6
        with:
          name: diagnostic-compilation-${{ github.run_number }}
          path: build-error.log
          if-no-files-found: error
          retention-days: 14

      - name: Arreter le build si la compilation echoue
        if: steps.gradle_build.outputs.exit_code != '0'
        run: |
          echo "La compilation Gradle a echoue. Le log complet est disponible dans l'artefact diagnostic-compilation-${{ github.run_number }}."
          exit 1

      - name: Verifier les icones dans l APK final
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          test -n "$AAPT2" || (echo "aapt2 introuvable" && exit 1)
          "$AAPT2" dump resources app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/horatrack-resources.txt"
          for color in red green orange; do
            grep -q "mipmap/horatrack_icon_${color}_v2" "$RUNNER_TEMP/horatrack-resources.txt" || {
              echo "Icone ${color} absente de l APK final"
              exit 1
            }
          done
          echo "Les trois icones HoraTrack valides sont presentes dans l APK final."

      - name: Verifier la signature APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER" || (echo "apksigner introuvable" && exit 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Preparer artefact Play canonique
        run: |
          cp app/build/outputs/bundle/play/app-play.aab AGKGMG-play.aab
          sha256sum AGKGMG-play.aab > AGKGMG-play-SHA256.txt
          printf '%s\n' "$VERSION_NAME" > AGKGMG-version.txt
          printf '%s\n' "$VERSION_CODE" > AGKGMG-version-code.txt
          printf '%s\n' "$SOURCE_SHA" > AGKGMG-source-sha.txt
          test -s AGKGMG-play.aab
          test -s AGKGMG-play-SHA256.txt
          test -s AGKGMG-version.txt
          test -s AGKGMG-version-code.txt
          test -s AGKGMG-source-sha.txt

      - name: Verifier la signature AAB Play
        env:
          POINTAGE_KEYSTORE_PASSWORD: ${{ secrets.POINTAGE_KEYSTORE_PASSWORD }}
          POINTAGE_KEY_ALIAS: ${{ secrets.POINTAGE_KEY_ALIAS }}
        run: |
          jarsigner -verify -certs AGKGMG-play.aab
          EXPECTED_CERT="$(keytool -list -v \
            -keystore "$RUNNER_TEMP/pointage-release.keystore" \
            -storepass "$POINTAGE_KEYSTORE_PASSWORD" \
            -alias "$POINTAGE_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':[:space:]')"
          ACTUAL_CERT="$(keytool -printcert -jarfile AGKGMG-play.aab | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':[:space:]')"
          test -n "$EXPECTED_CERT"
          test -n "$ACTUAL_CERT"
          test "$EXPECTED_CERT" = "$ACTUAL_CERT"
          echo "Signature AAB Play valide et certificat conforme a la cle d upload."

      - name: Publier artefact Play pour le workflow Google Play
        uses: actions/upload-artifact@v6
        with:
          name: AGKGMG-Play-Bundle
          path: |
            AGKGMG-play.aab
            AGKGMG-play-SHA256.txt
            AGKGMG-version.txt
            AGKGMG-version-code.txt
            AGKGMG-source-sha.txt
          if-no-files-found: error
          retention-days: 30
