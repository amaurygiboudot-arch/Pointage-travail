name: Deploy Firestore rules

on:
  workflow_dispatch:
  push:
    branches: [ "main", "rebuild/diamond-celestial-v2" ]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy-firestore-rules.yml"

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Verifier les secrets Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Secret FIREBASE_SERVICE_ACCOUNT_JSON manquant" && exit 1)
          test -n "$FIREBASE_PROJECT_ID" || (echo "Secret FIREBASE_PROJECT_ID manquant" && exit 1)

      - name: Installer Firebase CLI
        run: npm install --global firebase-tools

      - name: Deployer les regles Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
