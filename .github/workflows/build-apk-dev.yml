name: HoraTrack DEV - APK unique

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/dev-build-trigger.txt"

concurrency:
  group: horatrack-apk-dev
  cancel-in-progress: true

jobs:
  dev-build:
    name: Tester puis compiler l APK DEV unique
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-cleanup: on-success

      - name: Verifications rapides de structure
        run: |
          python scripts/verify_launcher_icons.py
          python scripts/verify_update_architecture.py

      - name: Lancer les tests unitaires
        run: gradle :app:testDebugUnitTest --build-cache --parallel --stacktrace

      - name: Restaurer la cle de signature HoraTrack
        env:
          KEYSTORE_B64: ${{ secrets.POINTAGE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POINTAGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POINTAGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POINTAGE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Secret POINTAGE_KEYSTORE_B64 manquant" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Secret POINTAGE_KEYSTORE_PASSWORD manquant" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Secret POINTAGE_KEY_ALIAS manquant" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Secret POINTAGE_KEY_PASSWORD manquant" && exit 1)
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pointage-release.keystore"

      - name: Preparer la version de developpement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          PUBLIC_VERSION="${TAG#v}"
          VERSION_CODE="${PUBLIC_VERSION##*.}"
          if [ -z "$PUBLIC_VERSION" ] || ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -le 0 ]; then
            PUBLIC_VERSION="1.9"
            VERSION_CODE="9"
          fi
          DEV_REVISION="$(date +%s)"
          VERSION_NAME="${PUBLIC_VERSION}-dev-${DEV_REVISION}"
          echo "PUBLIC_VERSION=$PUBLIC_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "DEV_REVISION=$DEV_REVISION" >> "$GITHUB_ENV"
          echo "Build DEV unique: $VERSION_NAME (code Android $VERSION_CODE)."

      - name: Compiler APK release signe
        id: gradle_build
        env:
          POINTAGE_KEYSTORE_PATH: ${{ runner.temp }}/pointage-release.keystore
          POINTAGE_KEYSTORE_PASSWORD: ${{ secrets.POINTAGE_KEYSTORE_PASSWORD }}
          POINTAGE_KEY_ALIAS: ${{ secrets.POINTAGE_KEY_ALIAS }}
          POINTAGE_KEY_PASSWORD: ${{ secrets.POINTAGE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: |
          set +e
          gradle :app:assembleRelease --build-cache --parallel --stacktrace 2>&1 | tee build-error.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publier le diagnostic si la compilation echoue
        if: steps.gradle_build.outputs.exit_code != '0'
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-build-dev-${{ github.run_number }}
          path: build-error.log
          if-no-files-found: error
          retention-days: 7

      - name: Arreter si la compilation echoue
        if: steps.gradle_build.outputs.exit_code != '0'
        run: exit 1

      - name: Verifier la signature APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER" || (echo "apksigner introuvable" && exit 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Preparer l APK DEV unique
        run: |
          cp app/build/outputs/apk/release/app-release.apk HoraTrack-dev.apk
          sha256sum HoraTrack-dev.apk > SHA256-dev.txt
          printf '%s\n' "$VERSION_NAME" > HoraTrack-dev-version.txt
          test -s HoraTrack-dev.apk
          test -s SHA256-dev.txt
          test -s HoraTrack-dev-version.txt

      - name: Publier au seul emplacement DEV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="DEV_VERSION=$VERSION_NAME
          CHANNEL=development
          BUILD_KIND=tested
          SOURCE_SHA=$GITHUB_SHA"

          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest \
              --title "HoraTrack DEV - derniere APK" \
              --notes "$NOTES" \
              --prerelease
            gh release upload dev-latest \
              HoraTrack-dev.apk \
              SHA256-dev.txt \
              HoraTrack-dev-version.txt \
              --clobber
          else
            gh release create dev-latest \
              HoraTrack-dev.apk \
              SHA256-dev.txt \
              HoraTrack-dev-version.txt \
              --target "$GITHUB_SHA" \
              --title "HoraTrack DEV - derniere APK" \
              --notes "$NOTES" \
              --prerelease
          fi

          echo "APK DEV unique: https://github.com/$GITHUB_REPOSITORY/releases/tag/dev-latest"
