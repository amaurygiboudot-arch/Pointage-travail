name: HoraTrack DEV - APK unique

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/v2-celestial-earth-centered-360
    paths:
      - '.github/dev-build-trigger.txt'

permissions:
  contents: write

jobs:
  build-dev-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify repository structure
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Resolve DEV version from latest public release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_JSON="$(gh api repos/${GITHUB_REPOSITORY}/releases/latest)"
          PUBLIC_VERSION="$(printf '%s' "$RELEASE_JSON" | jq -r '.name // .tag_name // ""' | sed -E 's/^v//')"
          if [ -z "$PUBLIC_VERSION" ]; then
            PUBLIC_VERSION="1.0.0"
          fi
          VERSION_CODE="$(printf '%s' "$PUBLIC_VERSION" | sed -E 's/[^0-9]//g')"
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=1
          fi
          DEV_VERSION="${PUBLIC_VERSION}-dev-$(date +%s)"
          echo "public_version=$PUBLIC_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "dev_version=$DEV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build signed DEV release APK
        env:
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.dev_version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose --print-certs "$APK_PATH"

      - name: Prepare DEV release assets
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          cp "$APK_PATH" HoraTrack-dev.apk
          sha256sum HoraTrack-dev.apk > SHA256-dev.txt
          printf '%s\n' '${{ steps.version.outputs.dev_version }}' > HoraTrack-dev-version.txt

      - name: Publish DEV latest release
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_VERSION: ${{ steps.version.outputs.dev_version }}
        run: |
          NOTES=$(cat <<EOF
          DEV_VERSION=${DEV_VERSION}
          CHANNEL=development
          BUILD_KIND=tested
          SOURCE_SHA=${GITHUB_SHA}
          EOF
          )
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest --title "HoraTrack DEV" --notes "$NOTES"
          else
            gh release create dev-latest --title "HoraTrack DEV" --notes "$NOTES" --prerelease
          fi
          gh release upload dev-latest HoraTrack-dev.apk SHA256-dev.txt HoraTrack-dev-version.txt --clobber
