name: PR 254 Android check

on:
  push:
    branches:
      - refactor/v2-paid-time-policy

concurrency:
  group: pr-254-android-check
  cancel-in-progress: true

jobs:
  test:
    name: Tests Android PR 254
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-cleanup: on-success

      - name: Verifications rapides de structure
        run: |
          python scripts/verify_launcher_icons.py
          python scripts/verify_update_architecture.py

      - name: Tests unitaires Android
        run: gradle :app:testDebugUnitTest --build-cache --parallel --stacktrace
