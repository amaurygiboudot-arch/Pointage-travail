name: Compiler HoraTrack APK rapide

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/fast-build-trigger.txt"

concurrency:
  group: horatrack-apk-fast
  cancel-in-progress: true

jobs:
  fast-build:
    name: Compiler APK de test signe
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-cleanup: on-success

      - name: Verifications rapides de structure
        run: |
          python scripts/verify_launcher_icons.py
          python scripts/verify_update_architecture.py

      - name: Restaurer la cle de signature HoraTrack
        env:
          KEYSTORE_B64: ${{ secrets.POINTAGE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POINTAGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POINTAGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POINTAGE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Secret POINTAGE_KEYSTORE_B64 manquant" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Secret POINTAGE_KEYSTORE_PASSWORD manquant" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Secret POINTAGE_KEY_ALIAS manquant" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Secret POINTAGE_KEY_PASSWORD manquant" && exit 1)
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pointage-release.keystore"

      - name: Reutiliser la version publique courante
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          VERSION_NAME="${TAG#v}"
          VERSION_CODE="${VERSION_NAME##*.}"
          if [ -z "$VERSION_NAME" ] || ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -le 0 ]; then
            VERSION_NAME="1.9"
            VERSION_CODE="9"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Build rapide signe en version $VERSION_NAME ($VERSION_CODE) pour rester installable par-dessus la version publique courante."

      - name: Tests unitaires et compilation APK release
        id: gradle_build
        env:
          POINTAGE_KEYSTORE_PATH: ${{ runner.temp }}/pointage-release.keystore
          POINTAGE_KEYSTORE_PASSWORD: ${{ secrets.POINTAGE_KEYSTORE_PASSWORD }}
          POINTAGE_KEY_ALIAS: ${{ secrets.POINTAGE_KEY_ALIAS }}
          POINTAGE_KEY_PASSWORD: ${{ secrets.POINTAGE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleRelease --build-cache --parallel --stacktrace 2>&1 | tee build-error.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publier le diagnostic si la compilation echoue
        if: steps.gradle_build.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-build-rapide-${{ github.run_number }}
          path: build-error.log
          if-no-files-found: error
          retention-days: 7

      - name: Arreter si la compilation echoue
        if: steps.gradle_build.outputs.exit_code != '0'
        run: exit 1

      - name: Verifier la signature APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER" || (echo "apksigner introuvable" && exit 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Preparer l APK de test
        run: |
          cp app/build/outputs/apk/release/app-release.apk HoraTrack-fast.apk
          sha256sum HoraTrack-fast.apk > HoraTrack-fast-SHA256.txt
          printf '%s\n' "$VERSION_NAME" > HoraTrack-fast-version.txt
          test -s HoraTrack-fast.apk

      - name: Publier uniquement l artefact de test
        uses: actions/upload-artifact@v4
        with:
          name: HoraTrack-APK-RAPIDE
          path: |
            HoraTrack-fast.apk
            HoraTrack-fast-SHA256.txt
            HoraTrack-fast-version.txt
          if-no-files-found: error
          retention-days: 14
