name: Publish AGKGMG to Google Play internal

on:
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      test_track:
        required: true
        type: string
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false
      FIREBASE_SERVICE_ACCOUNT_JSON:
        required: false
  workflow_run:
    workflows:
      - "Compiler HoraTrack APK et AAB"
    types:
      - completed

concurrency:
  group: google-play-internal
  cancel-in-progress: false

jobs:
  publish-internal:
    name: Publish signed AAB to Google Play internal
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.source_sha == github.sha &&
       inputs.build_run_id == format('{0}', github.run_id) &&
       (inputs.test_track == 'internal' || inputs.test_track == 'qa'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Recuperer le commit de test exact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Revalider les CI avant publication de test
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python scripts/verify_play_test_release.py

      - name: Download exact signed Play bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/play"
          gh run download "$BUILD_RUN_ID" \
            --repo "${{ github.repository }}" \
            -n "AGKGMG-Play-Bundle" \
            -D "$RUNNER_TEMP/play"
          cd "$RUNNER_TEMP/play"
          test -s AGKGMG-play.aab
          test -s AGKGMG-play-SHA256.txt
          test -s AGKGMG-version.txt
          test -s AGKGMG-version-code.txt
          test -s AGKGMG-source-sha.txt
          sha256sum -c AGKGMG-play-SHA256.txt
          VERSION_NAME="$(cat AGKGMG-version.txt)"
          VERSION_CODE="$(cat AGKGMG-version-code.txt)"
          SOURCE_SHA="$(cat AGKGMG-source-sha.txt)"
          test "$VERSION_CODE" -gt 1470
          test "$SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Select secured Google credential
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          else
            echo "::error::Aucun compte de service Google disponible pour Android Publisher."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/play-service-account.json"
          echo "PLAY_CREDENTIALS=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"

      - name: Install Android Publisher client dependencies
        run: python -m pip install --quiet google-auth requests

      - name: Publish to internal testing
        env:
          PACKAGE_NAME: com.amaury.pointage
          TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
          TEST_TRACK: ${{ inputs.test_track }}
        run: |
          python <<'PY'
          import os, pathlib, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          package = os.environ["PACKAGE_NAME"]
          expected = int(os.environ["EXPECTED_VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          credential_file = os.environ["PLAY_CREDENTIALS"]
          aab = pathlib.Path(os.environ["RUNNER_TEMP"]) / "play" / "AGKGMG-play.aab"

          credentials = service_account.Credentials.from_service_account_file(
              credential_file,
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          credentials.refresh(Request())
          headers = {"Authorization": f"Bearer {credentials.token}"}
          api = "https://androidpublisher.googleapis.com/androidpublisher/v3"

          def require_ok(response, label):
              if response.ok:
                  return
              try:
                  detail = response.json()
              except Exception:
                  detail = response.text[:4000]
              raise RuntimeError(f"{label}: HTTP {response.status_code}: {detail}")

          edit_response = requests.post(
              f"{api}/applications/{package}/edits",
              headers={**headers, "Content-Type": "application/json"},
              json={},
              timeout=30,
          )
          require_ok(edit_response, "Création de l edit")
          edit_id = edit_response.json()["id"]

          tracks_response = requests.get(
              f"{api}/applications/{package}/edits/{edit_id}/tracks",
              headers=headers,
              timeout=30,
          )
          require_ok(tracks_response, "Liste des tracks")
          tracks = tracks_response.json().get("tracks", [])
          non_prod = [t for t in tracks if str(t.get("track", "")).strip() not in ("", "production")]

          def highest_code(track):
              codes = []
              for release in track.get("releases") or []:
                  for code in release.get("versionCodes") or []:
                      try:
                          codes.append(int(code))
                      except (TypeError, ValueError):
                          pass
              return max(codes) if codes else -1

          populated = [t for t in non_prod if highest_code(t) >= 0]
          if os.environ.get("TEST_ONLY") == "true":
              # No heuristic, production, open testing or closed-track fallback before merge.
              play_track = os.environ.get("TEST_TRACK", "")
              if play_track not in {"internal", "qa"} or not any(t.get("track") == play_track for t in tracks):
                  raise RuntimeError("Piste de test absente ou non autorisée; publication refusée")
          elif populated:
              populated.sort(
                  key=lambda t: (
                      highest_code(t),
                      1 if str(t.get("track", "")).strip() == "internal" else 0,
                      1 if str(t.get("track", "")).strip() == "qa" else 0,
                  ),
                  reverse=True,
              )
              play_track = str(populated[0]["track"]).strip()
          else:
              available = [str(t.get("track", "")).strip() for t in non_prod]
              if "internal" in available:
                  play_track = "internal"
              elif "qa" in available:
                  play_track = "qa"
              elif len(available) == 1:
                  play_track = available[0]
              else:
                  raise RuntimeError(f"Aucun track interne identifiable: {available}")

          print(f"Track Google Play sélectionné: {play_track}")

          with aab.open("rb") as handle:
              upload = requests.post(
                  f"https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/{package}/edits/{edit_id}/bundles",
                  params={"uploadType": "media"},
                  headers={**headers, "Content-Type": "application/octet-stream"},
                  data=handle,
                  timeout=180,
              )
          require_ok(upload, "Upload AAB")
          uploaded_code = int(upload.json()["versionCode"])
          if uploaded_code != expected:
              raise RuntimeError(f"VersionCode AAB inattendu: {uploaded_code} != {expected}")

          track = requests.put(
              f"{api}/applications/{package}/edits/{edit_id}/tracks/{play_track}",
              headers={**headers, "Content-Type": "application/json"},
              json={
                  "track": play_track,
                  "releases": [{
                      "name": f"AGKGMG {version_name}",
                      "versionCodes": [str(uploaded_code)],
                      "status": "completed",
                      "releaseNotes": [{
                          "language": "fr-FR",
                          "text": "Mise à jour interne AGKGMG via Google Play."
                      }]
                  }]
              },
              timeout=30,
          )
          require_ok(track, f"Mise à jour du track {play_track}")

          commit = requests.post(
              f"{api}/applications/{package}/edits/{edit_id}:commit",
              headers={**headers, "Content-Type": "application/json"},
              json={},
              timeout=30,
          )
          require_ok(commit, "Commit Google Play")
          print(f"Google Play internal: versionCode {uploaded_code} publiée sur {play_track}.")
          PY

      - name: Remove temporary credential
        if: always()
        run: rm -f "$RUNNER_TEMP/play-service-account.json"
