name: PR 255 Android check

on:
  push:
    branches:
      - fix/v2-part-time-gross-reliability

permissions:
  contents: read

jobs:
  android-validation:
    name: Salary V2 tests and Android build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Verify single APK update path
        run: python scripts/verify_update_architecture.py
      - name: Compile Android app
        run: gradle :app:assembleDebug --stacktrace
