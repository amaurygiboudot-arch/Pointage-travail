name: Security checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect dependency manifest changes
        id: dependency-files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '(^|/)(build\.gradle(\.kts)?|settings\.gradle(\.kts)?|gradle\.properties|libs\.versions\.toml|package(-lock)?\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml)$|^gradle/wrapper/gradle-wrapper\.properties$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dependency review
        if: steps.dependency-files.outputs.run == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # AGP 9.4.1 still declares Bouncy Castle 1.80.2 transitively in its
          # metadata. The separate gradle-security-build job must prove that
          # Gradle resolves bcprov/bcpkix/bcutil to 1.86 before this PR can pass.
          # Keep this exception limited to those two AGP metadata advisories.
          allow-ghsas: GHSA-9pwp-9qqc-pr26, GHSA-qp49-qgx5-5m26
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300
      - name: Dependency review not required
        if: steps.dependency-files.outputs.run != 'true'
        run: echo "No dependency manifest changed; dependency graph comparison is not applicable to this pull request."

  v2-unit-tests:
    name: V2 unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Codex agent configuration
        run: python scripts/validate_codex_agents.py
      - name: Test agent orchestration
        run: python scripts/test_agent_orchestration.py
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run V2 unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

  firebase-functions-tests:
    name: Firebase Functions tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Functions dependencies
        run: npm install --prefix functions
      - name: Run Functions tests only
        run: npm test --prefix functions

  codeql:
    name: CodeQL Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - name: Build debug for analysis
        run: gradle :app:assembleDebug --stacktrace
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java-kotlin'

  gradle-security-build:
    name: Security update build check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify single APK update path
        run: python scripts/verify_update_architecture.py
      - name: Verify patched Bouncy Castle is selected
        shell: bash
        run: |
          set -euo pipefail
          gradle buildEnvironment --console=plain > /tmp/build-environment.txt
          cat /tmp/build-environment.txt
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('/tmp/build-environment.txt').read_text(encoding='utf-8')
          artifacts = (
              'bcprov-jdk18on',
              'bcpkix-jdk18on',
              'bcutil-jdk18on',
          )
          for artifact in artifacts:
              pattern = re.compile(
                  rf'org\.bouncycastle:{re.escape(artifact)}:([^\s]+)(?:\s+->\s+([^\s]+))?'
              )
              matches = pattern.findall(text)
              if not matches:
                  raise SystemExit(f'{artifact}: absent du classpath de build résolu')
              selected = [target or requested for requested, target in matches]
              bad = [version for version in selected if version != '1.86']
              if bad:
                  raise SystemExit(
                      f'{artifact}: version résolue non sûre détectée: {bad}; attendu 1.86'
                  )
              print(f'{artifact}: 1.86 sélectionné ({len(matches)} occurrence(s))')
          PY
      - name: Compile Android app
        run: gradle :app:assembleDebug --stacktrace

      - name: Require successful iOS build for mobile release readiness
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          if ! printf '%s\n' "$changed" | grep -Eq '^(app/|ios/|build\.gradle\.kts$|settings\.gradle\.kts$|gradle/|\.github/workflows/build-ios\.yml$)'; then
            echo "No mobile/release change detected; cross-platform build gate is not applicable."
            exit 0
          fi

          echo "Mobile/release change detected; waiting for the exact-HEAD iOS build before release readiness."

          for attempt in $(seq 1 80); do
            checks="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100")"

            latest="$(printf '%s' "$checks" | jq -c '[.check_runs[] | select(.name == "build-ios")] | sort_by(.started_at // .created_at) | last // empty')"

            if [ -z "$latest" ]; then
              echo "[$attempt/80] build-ios check not created yet."
              sleep 15
              continue
            fi

            status="$(printf '%s' "$latest" | jq -r '.status')"
            conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // ""')"
            url="$(printf '%s' "$latest" | jq -r '.html_url // ""')"

            echo "[$attempt/80] build-ios status=$status conclusion=${conclusion:-pending} $url"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "iOS build succeeded for the exact PR HEAD."
                exit 0
              fi
              echo "::error::iOS build did not succeed for the exact PR HEAD: $conclusion"
              exit 1
            fi

            sleep 15
          done

          echo "::error::Timed out waiting for build-ios on the exact PR HEAD."
          exit 1

  play-distribution-check:
    name: Google Play distribution check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile Google Play APK and AAB variants
        run: gradle :app:assemblePlay :app:bundlePlay --stacktrace
      - name: Verify merged Play manifest
        shell: bash
        run: |
          manifest="$(find app/build/intermediates -type f -name AndroidManifest.xml -path '*/play/*' | head -n 1)"
          test -n "$manifest"
          echo "Merged Play manifest: $manifest"
          ! grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' "$manifest"
          ! grep -Fq '.update-files' "$manifest"
          ! grep -Fq 'UpdateDownloadReceiver' "$manifest"
          ! grep -Fq 'HpFirebaseMessagingService' "$manifest"

  agent-review-gate:
    name: Agent review gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Route PR to required agents
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          python3 scripts/agent_router.py             --base "$BASE_SHA"             --head "$HEAD_SHA"             --output .agent-route.json             --pretty
          cat .agent-route.json

      - name: Check existing agent review evidence
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" > .agent-comments.json
          set +e
          python3 scripts/validate_agent_review.py             --route .agent-route.json             --comments .agent-comments.json             --head "$HEAD_SHA"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect automatic Codex authentication
        id: codex-auth
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run required HoraTrack agents with Codex
        id: codex-review
        if: steps.existing.outputs.valid != 'true' && steps.codex-auth.outputs.configured == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          effort: high
          output-schema-file: scripts/agent-review.schema.json
          output-file: .agent-review.json
          prompt: |
            Read scripts/agent-review-prompt.md and follow it exactly.
            This is a review-only task. Do not modify tracked files.
            BASE_SHA=${{ github.event.pull_request.base.sha }}
            HEAD_SHA=${{ github.event.pull_request.head.sha }}
            Review only the diff BASE_SHA...HEAD_SHA and the context strictly required to assess it.
            The final response must satisfy scripts/agent-review.schema.json.

      - name: Validate automatic multi-agent report
        if: steps.existing.outputs.valid != 'true' && steps.codex-auth.outputs.configured == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/validate_agent_review.py             --route .agent-route.json             --report .agent-review.json             --head "$HEAD_SHA"

      - name: Publish automatic multi-agent report
        if: steps.existing.outputs.valid != 'true' && steps.codex-auth.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/format_agent_review_comment.py             --route .agent-route.json             --report .agent-review.json > .agent-review-comment.md
          gh pr comment "$PR_NUMBER" --body-file .agent-review-comment.md

      - name: Require authenticated agent review
        if: steps.existing.outputs.valid != 'true' && steps.codex-auth.outputs.configured != 'true'
        run: |
          echo "::error::Aucune preuve multi-agents valide pour ce HEAD et OPENAI_API_KEY n'est pas configuré."
          echo "::error::Dans le Codespace authentifié, exécuter: bash scripts/agent-toolbox.sh agent-review origin/main HEAD"
          echo "::error::Puis relancer ce workflow. Un agent absent n'est jamais considéré PASS."
          exit 1

