name: Security checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect dependency manifest changes
        id: dependency-files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '(^|/)(build\.gradle(\.kts)?|settings\.gradle(\.kts)?|gradle\.properties|libs\.versions\.toml|package(-lock)?\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml)$|^gradle/wrapper/gradle-wrapper\.properties$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dependency review
        if: steps.dependency-files.outputs.run == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300
      - name: Dependency review not required
        if: steps.dependency-files.outputs.run != 'true'
        run: echo "No dependency manifest changed; dependency graph comparison is not applicable to this pull request."

  v2-unit-tests:
    name: V2 unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run V2 unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

  firebase-functions-tests:
    name: Firebase Functions tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Functions dependencies
        run: npm install --prefix functions
      - name: Run Functions tests only
        run: npm test --prefix functions

  codeql:
    name: CodeQL Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - name: Build debug for analysis
        run: gradle :app:assembleDebug --stacktrace
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java-kotlin'

  gradle-security-build:
    name: Security update build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify single APK update path
        run: python scripts/verify_update_architecture.py
      - name: Compile Android app
        run: gradle :app:assembleDebug --stacktrace

  play-distribution-check:
    name: Google Play distribution check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Google Play variant
        run: gradle :app:assemblePlay --stacktrace
      - name: Verify merged Play manifest
        shell: bash
        run: |
          manifest="$(find app/build/intermediates -type f -name AndroidManifest.xml -path '*/play/*' | head -n 1)"
          test -n "$manifest"
          echo "Merged Play manifest: $manifest"
          ! grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' "$manifest"
          ! grep -Fq '.update-files' "$manifest"
          ! grep -Fq 'UpdateDownloadReceiver' "$manifest"
          ! grep -Fq 'HpFirebaseMessagingService' "$manifest"
