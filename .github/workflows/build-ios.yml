name: Build iOS

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - 'scripts/agent-toolbox.sh'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/agent-toolbox.sh'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/HPTravail
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios/HPTravail
        run: xcodebuild -project HPTravail.xcodeproj -scheme HPTravail -resolvePackageDependencies

      - name: Build for iOS Simulator
        working-directory: ios/HPTravail
        run: |
          xcodebuild \
            -project HPTravail.xcodeproj \
            -scheme HPTravail \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CELESTIAL_WEATHER_ENDPOINT=https://api.open-meteo.com/v1/forecast \
            build

      - name: Run Swift contracts and WorkStore XCTest integration tests
        run: bash scripts/agent-toolbox.sh ios-tests
