name: Build iOS

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/HPTravail
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios/HPTravail
        run: xcodebuild -project HPTravail.xcodeproj -scheme HPTravail -resolvePackageDependencies

      - name: Build for iOS Simulator
        working-directory: ios/HPTravail
        run: |
          set -o pipefail
          xcodebuild \
            -project HPTravail.xcodeproj \
            -scheme HPTravail \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive generic iOS device target
        working-directory: ios/HPTravail
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/HPTravail.xcarchive"
          xcodebuild \
            -project HPTravail.xcodeproj \
            -scheme HPTravail \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/HPTravail.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          test -d "$RUNNER_TEMP/HPTravail.xcarchive"

      - name: Publish unsigned archive diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: HPTravail-iOS-device-archive
          path: ${{ runner.temp }}/HPTravail.xcarchive
          if-no-files-found: error
          retention-days: 14
