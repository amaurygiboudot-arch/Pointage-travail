name: One-shot grant Cloud Scheduler role

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/grant-cloudscheduler-role.yml"

permissions:
  contents: read

jobs:
  grant-role:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POINTAGE_TRAVAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Grant Cloud Scheduler Admin to Firebase deploy account
        run: |
          gcloud projects add-iam-policy-binding pointage-travail \
            --member="serviceAccount:firebase-adminsdk-fbsvc@pointage-travail.iam.gserviceaccount.com" \
            --role="roles/cloudscheduler.admin" \
            --condition=None \
            --quiet
