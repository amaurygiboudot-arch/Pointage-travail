name: Actions storage cleanup

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cleanup-actions-storage.yml'
  workflow_run:
    workflows:
      - 'Compiler HoraTrack APK et AAB'
      - 'Compiler test Diamant Carbone'
    types: [ completed ]
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: actions-storage-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    name: Nettoyer le stockage GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Purger les artefacts redondants et anciens
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          all="$(mktemp)"
          del="$(mktemp)"
          trap 'rm -f "$all" "$del"' EXIT

          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .size_in_bytes, .created_at, .expired] | @tsv' > "$all"

          latest_full_id="$(awk -F '\t' '$2 == "HoraTrack-APK-AAB" && $5 == "false" { print }' "$all" \
            | sort -t $'\t' -k4,4 \
            | tail -n 1 \
            | cut -f1 || true)"

          now="$(date -u +%s)"
          kept=0

          while IFS=$'\t' read -r id name size created expired; do
            [ -n "${id:-}" ] || continue

            created_epoch="$(date -u -d "$created" +%s)"
            age_days="$(( (now - created_epoch) / 86400 ))"
            reason=""

            if [ "$expired" = "true" ]; then
              reason="expire"
            elif [ "$name" = "HoraTrack-APK-AAB" ] && [ "$id" != "$latest_full_id" ]; then
              reason="APK/AAB redondant avec GitHub Releases"
            elif [ "$name" = "HP-Travail-Diamant-Carbone-Test" ] && [ "$age_days" -ge 3 ]; then
              reason="test Diamant vieux de ${age_days}j"
            elif [[ "$name" == diagnostic-* ]] && [ "$age_days" -ge 7 ]; then
              reason="diagnostic vieux de ${age_days}j"
            elif [ "$age_days" -ge 14 ]; then
              reason="artefact vieux de ${age_days}j"
            fi

            if [ -n "$reason" ]; then
              printf '%s\t%s\t%s\t%s\n' "$id" "$size" "$name" "$reason" >> "$del"
            else
              kept="$((kept + 1))"
            fi
          done < "$all"

          deleted="$(wc -l < "$del" | tr -d ' ')"
          freed="$(awk -F '\t' '{ total += $2 } END { printf "%.0f", total + 0 }' "$del")"

          if [ "$deleted" -gt 0 ]; then
            echo "Suppression parallele de $deleted artefact(s)..."
            cut -f1 "$del" | xargs -r -P 12 -I{} bash -c '
              id="$1"
              if ! gh api --silent --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; then
                echo "Avertissement: suppression impossible pour artefact $id" >&2
              fi
            ' _ {}
          fi

          freed_mb="$(awk -v b="$freed" 'BEGIN { printf "%.1f", b / 1024 / 1024 }')"
          echo "Artefacts vises: $deleted"
          echo "Artefacts conserves: $kept"
          echo "Espace vise a liberer: ${freed_mb} MiB"
          {
            echo "## Nettoyage GitHub Actions"
            echo "- Artefacts vises/supprimes : $deleted"
            echo "- Artefacts conserves : $kept"
            echo "- Espace vise a liberer : ${freed_mb} MiB"
            echo "- Politique : dernier APK/AAB Actions conserve, anciens APK/AAB redondants supprimes, tests Diamant 3 j, diagnostics 7 j, autres artefacts 14 j."
            echo "- GitHub Releases, code, commits, branches et PR ne sont jamais supprimes par ce workflow."
          } >> "$GITHUB_STEP_SUMMARY"
