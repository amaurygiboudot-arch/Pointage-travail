name: Compiler test Diamant Carbone

on:
  push:
    branches: [ "diamond-facets-test", "rebuild/diamond-celestial-v2" ]
  workflow_dispatch:

concurrency:
  group: hp-travail-diamond-carbon-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Recuperer la branche de test
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restaurer la cle de signature
        env:
          KEYSTORE_B64: ${{ secrets.POINTAGE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POINTAGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POINTAGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POINTAGE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Secret POINTAGE_KEYSTORE_B64 manquant" && exit 1)
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pointage-release.keystore"

      - name: Preparer version monotone
        run: |
          VERSION_CODE=$(( $(date -u +%s) / 60 ))
          VERSION_NAME="1.9-rebuild.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Compilation versionCode=$VERSION_CODE versionName=$VERSION_NAME"

      - name: Compiler APK test signe
        env:
          POINTAGE_KEYSTORE_PATH: ${{ runner.temp }}/pointage-release.keystore
          POINTAGE_KEYSTORE_PASSWORD: ${{ secrets.POINTAGE_KEYSTORE_PASSWORD }}
          POINTAGE_KEY_ALIAS: ${{ secrets.POINTAGE_KEY_ALIAS }}
          POINTAGE_KEY_PASSWORD: ${{ secrets.POINTAGE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verifier APK Android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "Build-tools: $BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK" | grep "package: name='com.amaury.pointage'"

      - name: Preparer APK test
        run: |
          cp app/build/outputs/apk/release/app-release.apk HP-Travail-Diamant-Carbone-Test.apk
          sha256sum HP-Travail-Diamant-Carbone-Test.apk > SHA256-test.txt
          printf '%s\n' "$VERSION_CODE" > VERSION_CODE-test.txt
          printf '%s\n' "$VERSION_NAME" > VERSION_NAME-test.txt

      - name: Publier artefact de test uniquement
        uses: actions/upload-artifact@v4
        with:
          name: HP-Travail-Diamant-Carbone-Test
          path: |
            HP-Travail-Diamant-Carbone-Test.apk
            SHA256-test.txt
            VERSION_CODE-test.txt
            VERSION_NAME-test.txt
          if-no-files-found: error
          retention-days: 14
