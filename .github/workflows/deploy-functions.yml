name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - functions/**
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-functions.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firebase-functions
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Firebase credentials secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

      - name: Prepare Google credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Install and test functions
        run: |
          npm install --prefix functions
          npm test --prefix functions

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FUNCTIONS_DISCOVERY_TIMEOUT: "60"
        run: firebase deploy --only functions --project pointage-travail --non-interactive
