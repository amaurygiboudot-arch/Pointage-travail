#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "on-request"
default_permissions = "horatrack-dev"
allow_login_shell = false

[features]
apps = true

[agents]
enabled = true
max_concurrent_threads_per_session = 5
default_subagent_reasoning_effort = "medium"

[agents.salary_v2]
description = "Salaire V2, paie, conventions, majorations et règles vérifiables."
config_file = "./agents/salary-v2.toml"

[agents.time_engine]
description = "Pointage, temps, pauses, déplacements, GPS, zones et widgets."
config_file = "./agents/time-engine.toml"

[agents.mobile_platforms]
description = "Architecture Android/iOS, Firebase, stockage, permissions, builds et CI."
config_file = "./agents/mobile-platforms.toml"

[agents.ui_ux]
description = "UI/UX, navigation, affichages, accessibilité et rendu multi-écrans."
config_file = "./agents/ui-ux.toml"

[agents.celestial_system]
description = "Système céleste, astronomie, Soleil/Lune, globe GPS, cap/Nord vrai et Accueil céleste."
config_file = "./agents/celestial-system.toml"

[agents.security_privacy]
description = "Sécurité applicative, confidentialité, authentification, données sensibles et durcissement."
config_file = "./agents/security-privacy.toml"

[agents.performance_battery]
description = "Performance, batterie, mémoire, réseau, capteurs et exécution en arrière-plan."
config_file = "./agents/performance-battery.toml"

[agents.release_store]
description = "Builds de distribution, versions, signatures, Play Store/App Store, rollout et rollback."
config_file = "./agents/release-store.toml"

[agents.analytics_data]
description = "Instrumentation produit, qualité des données, métriques, funnels et observabilité respectueuse de la vie privée."
config_file = "./agents/analytics-data.toml"

[agents.team_lead]
description = "Chef d'équipe technique, coordination, dépendances et pré-validation."
config_file = "./agents/team-lead.toml"

[agents.qa_reviewer]
description = "QA indépendant en lecture seule, recherche de bugs et régressions."
config_file = "./agents/qa-reviewer.toml"

[agents.control_gate]
description = "Sas final en lecture seule, décision PASS/FAIL avant fusion."
config_file = "./agents/control-gate.toml"

[agents.sales_growth]
description = "Commercial, offres, argumentaires, démonstrations et retour marché."
config_file = "./agents/sales-growth.toml"

[agents.customer_support]
description = "SAV, diagnostic utilisateur, reproduction et escalade."
config_file = "./agents/customer-support.toml"

[agents.marketing_comms]
description = "Marketing, communication, SEO/ASO, pages store et lancement."
config_file = "./agents/marketing-comms.toml"

[agents.people_ops]
description = "Organisation interne, rôles, procédures et charge de l'équipe."
config_file = "./agents/people-ops.toml"

[agents.finance_accounting]
description = "Prix, abonnements, coûts, marges, prévisions et rentabilité."
config_file = "./agents/finance-accounting.toml"

[agents.legal_compliance]
description = "Juridique, RGPD, conformité store et validation des sources."
config_file = "./agents/legal-compliance.toml"

[agents.incident_ops]
description = "Incidents, triage, coordination de crise et post-mortems."
config_file = "./agents/incident-ops.toml"

[agents.product_manager]
description = "Produit, roadmap, priorisation et critères d'acceptation."
config_file = "./agents/product-manager.toml"

[agents.international_lead]
description = "Internationalisation et coordination des futures équipes pays."
config_file = "./agents/international-lead.toml"

[permissions.horatrack-dev]
description = "Développement HoraTrack avec gouvernance protégée."
extends = ":workspace"

[permissions.horatrack-dev.filesystem]
glob_scan_max_depth = 4

[permissions.horatrack-dev.filesystem.":workspace_roots"]
"." = "write"
"AGENTS.md" = "read"
".codex" = "read"
".github/workflows" = "read"
".github/CODEOWNERS" = "read"
"SECURITY.md" = "read"
"**/.env*" = "deny"
"**/*.pem" = "deny"

# GitHub MCP prêt pour l'étape d'authentification. Désactivé par défaut :
# aucune clé ni aucun jeton n'est stocké dans le dépôt.
[mcp_servers.github]
enabled = true
required = false
url = "https://api.githubcopilot.com/mcp/readonly"
http_headers_helper = "bash scripts/github-mcp-headers.sh"
default_tools_approval_mode = "prompt"


# Firebase MCP officiel : diagnostic uniquement.
# Le serveur utilise les identifiants de la Firebase CLI présents dans le Codespace.
# Aucune écriture Firestore/Auth/Remote Config ni aucun déploiement n'est exposé.
[mcp_servers.firebase]
enabled = true
required = false
command = "npx"
args = ["-y", "firebase-tools@latest", "mcp", "--dir", ".", "--only", "functions,crashlytics,apphosting,developerknowledge"]
default_tools_approval_mode = "prompt"
startup_timeout_sec = 30
enabled_tools = [
  "firebase_get_environment",
  "firebase_get_project",
  "firebase_list_apps",
  "firebase_list_projects",
  "firebase_get_sdk_config",
  "firebase_get_security_rules",
  "firebase_read_resources",
  "functions_get_logs",
  "functions_list_functions",
  "crashlytics_get_issue",
  "crashlytics_list_events",
  "crashlytics_batch_get_events",
  "crashlytics_list_notes",
  "crashlytics_get_report",
  "apphosting_fetch_logs",
  "apphosting_list_backends",
  "developerknowledge_search_documents",
  "developerknowledge_answer_query"
]
