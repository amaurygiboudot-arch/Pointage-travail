# Release L8 and lint run together; bound worker concurrency within the heap budget.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
# Temporary compatibility mode for AGP 9.4: keep the existing Kotlin plugin while
# the dedicated built-in Kotlin migration is validated separately.
android.builtInKotlin=false
android.newDsl=false
