    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amaury.hptravail.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HPTravail:
    build:
      targets:
        HPTravail: all
        HPTravailTests: [test]
    test:
      config: Debug
      targets:
        - HPTravailTests
