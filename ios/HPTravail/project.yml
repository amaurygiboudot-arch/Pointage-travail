name: HPTravail
options:
  bundleIdPrefix: com.amaury
settings:
  base:
    SWIFT_VERSION: 5.9
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0
targets:
  HPTravail:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - HPTravail
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: HPTravail/Info.plist
      properties:
        CFBundleDisplayName: HP Travail
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: HP Travail utilise votre position pour le pointage GPS et l'affichage soleil/lune.
        NSLocationAlwaysAndWhenInUseUsageDescription: HP Travail peut utiliser votre position en arrière-plan pour le pointage automatique si vous l'activez.
        NSMotionUsageDescription: HP Travail utilise l'orientation de l'iPhone pour afficher le ciel dans la bonne direction.
        CelestialWeatherEndpoint: $(CELESTIAL_WEATHER_ENDPOINT)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.827513765896-1123kjunj8pn19b487jpctq101qfr22l
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amaury.hptravail
        PRODUCT_NAME: HP Travail
        PRODUCT_MODULE_NAME: HPTravail
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CELESTIAL_WEATHER_ENDPOINT: ""

  HPTravailTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - HPTravailTests
      - HPTravailCelestialTests
      - path: HPTravail/CelestialV2/Core/CelestialEngineV2.swift
      - path: HPTravail/CelestialV2/Core/CelestialProjectionV2.swift
      - path: HPTravail/CelestialV2/Core/CelestialQualityV2.swift
      - path: HPTravail/CelestialV2/Core/AtmosphericRefractionV2.swift
      - path: HPTravail/CelestialV2/Core/SolarEclipseGeometryV2.swift
      - path: HPTravail/RuntimeV2/WorkSessionPersistenceV2.swift
      - path: HPTravail/SalaryV2/SalaryReferenceContractV2.swift
      - path: HPTravail/SalaryV2/SalaryWorkspaceStateV2.swift
      - path: HPTravail/SalaryV2/SalaryCompanyStoreV2.swift
      - path: HPTravail/SalaryV2/SalaryCompanySelectionV2.swift
      - path: HPTravail/SalaryV2/SalaryConventionRuleStoreV2.swift
      - path: HPTravail/SalaryV2/SalaryConventionCoverageV2.swift
      - path: HPTravail/SalaryV2/SalaryConventionSegmentPayrollCompatibilityV2.swift
      - path: HPTravail/SalaryV2/SalaryConventionPayrollBridgeV2.swift
      - path: HPTravail/SalaryV2/SalaryEmployeeSocialProfileV2.swift
      - path: HPTravail/SalaryV2/SocialSecurityCeilingV2.swift
