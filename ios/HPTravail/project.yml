name: HPTravail
options:
  bundleIdPrefix: com.amaury
settings:
  base:
    SWIFT_VERSION: 5.9
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0
targets:
  HPTravail:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - HPTravail
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: HPTravail/Info.plist
      properties:
        CFBundleDisplayName: AGKGMG
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: AGKGMG utilise votre position pour le pointage GPS et l'affichage soleil/lune.
        NSLocationAlwaysAndWhenInUseUsageDescription: AGKGMG peut utiliser votre position en arrière-plan pour le pointage automatique si vous l'activez.
        NSMotionUsageDescription: AGKGMG utilise l'orientation de l'iPhone pour afficher le ciel dans la bonne direction.
        CelestialWeatherEndpoint: $(CELESTIAL_WEATHER_ENDPOINT)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.827513765896-1123kjunj8pn19b487jpctq101qfr22l
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amaury.hptravail
        PRODUCT_NAME: HP Travail
        PRODUCT_MODULE_NAME: HPTravail
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CELESTIAL_WEATHER_ENDPOINT: ""
        MARKETING_VERSION: "1.9"
        CURRENT_PROJECT_VERSION: "9"

  HPTravailTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - HPTravailTests
      - HPTravailCelestialTests
      - path: HPTravail/CelestialV2/Core/CelestialEngineV2.swift
      - path: HPTravail/CelestialV2/Core/CelestialProjectionV2.swift
      - path: HPTravail/CelestialV2/Core/CelestialQualityV2.swift
      - path: HPTravail/CelestialV2/Core/AtmosphericRefractionV2.swift
      - path: HPTravail/CelestialV2/Core/SolarEclipseGeometryV2.swift
      - path: HPTravail/RuntimeV2/WorkSessionPersistenceV2.swift
      # Même module canonique complet que la cible Swift Package SalaryV2Contract.
      - path: HPTravail/SalaryV2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amaury.hptravail.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HPTravail:
    build:
      targets:
        HPTravail: all
        HPTravailTests: [test]
    test:
      config: Debug
      targets:
        - HPTravailTests
